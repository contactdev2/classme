appId: com.contactdev2.classme
name: A teacher can type a classroom name and save it to create a new classroom.
---
# A teacher on a phone of their own: a profile is made, the welcome is read, and from the Home
# dashboard the row along the bottom takes them to their classes. The list has nothing in it, which
# is the card this requirement's mockup draws — and the one thing on it to press.
- tapOn: "Create a profile"
- tapOn: "Ms. Patel"
- inputText: "Ms. Rivera"
- hideKeyboard
- tapOn: "Continue"
- tapOn: "you@school.edu"
- inputText: "ms.rivera@riversidehigh.edu"
- hideKeyboard
- tapOn: "At least 8 characters"
- inputText: "Spring-2026-attendance"
- hideKeyboard
# The screen's own name says "Create Profile" above the steps, and so does the button under the
# password: the second of the two is the button.
- tapOn:
    text: "Create Profile"
    index: 1
# Stretching the password is the phone's own arithmetic, done once, and it is not quick.
- extendedWaitUntil:
    visible: "Profile Created.*"
    timeout: 120000
- tapOn: "Go to Dashboard"
# The welcome a teacher is met with on their first morning, walked through to the dashboard.
- extendedWaitUntil:
    visible: "A simpler way to manage.*"
    timeout: 30000
- tapOn: "Get Started"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: ".*what's happening today.*"
    timeout: 30000
- tapOn: "Classes"
- extendedWaitUntil:
    visible: "My Classes"
    timeout: 30000
# The empty list, as the mockup draws it: what a classroom is for, and the way to make one.
- assertVisible: "Create your first classroom.*"
- tapOn: "Create Classroom"
- extendedWaitUntil:
    visible: "New Classroom"
    timeout: 30000
# A name, a period, and the button under them. The icon and the colour are already chosen.
- tapOn: "e.g. Mathematics"
- inputText: "Mathematics"
- hideKeyboard
- tapOn: "e.g. 1st Period"
- inputText: "1st Period"
- hideKeyboard
- tapOn: "Create Classroom"
# Back in their own list, with the class in it and the confirmation above it.
- extendedWaitUntil:
    visible: "Mathematics has been created."
    timeout: 30000
- assertVisible: "My Classes"
- assertVisible: "Mathematics"
- assertVisible: "1st Period.*"
