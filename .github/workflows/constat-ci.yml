# constat:template id=node-ci-workflow version=52 sha256=d3294e8d4f4e6329954cd0e28c6a3e7356480c564154f8426c7554ee4b896b67
name: constat-ci
# Generated by DoneMark's onboarding pull request. Runs this project's jest suite and publishes a
# machine-readable per-test report DoneMark's collector reads by name (see
# .github/scripts/constat-jest-report.mjs), plus a second run of the same suite against the code
# as it was before the change, so a passing check can be told apart from one that cannot fail.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      # A browser for the checks that take pictures. GitHub's Ubuntu runners ship Chrome; this line
      # fails loudly if a different runner does not — better than a check that could not run.
      - run: google-chrome --version
      - id: tests
        run: npm run test:ci
      - if: always() && steps.tests.conclusion != 'skipped'
        run: node .github/scripts/constat-jest-report.mjs .constat/check-report/raw.json .constat/check-report/checks.json
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report
          path: .constat/check-report/checks.json
          if-no-files-found: error
      # The pictures those checks took, from the SAME run as the report: DoneMark reads pictures only
      # from the run that carried the check report. An empty folder is fine — not every commit has a
      # visual criterion.
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-pictures
          path: .constat/pictures/
          if-no-files-found: ignore

  try-starts:
    # The start file a judge tries the app with (spec 2026-10-01-try-it-design.md §4): started here so
    # it cannot quietly break. Only where the app carries it — checked in a step, because GitHub refuses
    # hashFiles at job level — and never turning the release's CI red: trying never gates a verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      # The branch's own head on a pull request, not GitHub's merge of it: what was walked is what the
      # report names (the review of 2 October 2026).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: start-file
        run: if [ -f .devcontainer/compose.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # Told its commit, so /api/v1/version names it and the walk counts; and out of try mode, so the
      # DoneMark strip never shows a journey the words it is looking for.
      - if: steps.start-file.outputs.present == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: CONSTAT_COMMIT="$HEAD_SHA" DONEMARK_TRY=0 docker compose -f .devcontainer/compose.yaml up -d
      - if: steps.start-file.outputs.present == 'true'
        run: |
          for _ in $(seq 1 180); do
            if curl -fsS http://localhost:3000/ > /dev/null; then echo "the app answers on /"; exit 0; fi
            sleep 5
          done
          docker compose -f .devcontainer/compose.yaml logs app | tail -80
          echo "the app did not answer on / within 15 minutes"; exit 1
      # Its journeys, walked on the app it started (spec 2026-10-02 §3): Classroom's "a teacher signs up"
      # never ran, journeys being walked only on a Vercel copy. The report names the branch's own commit,
      # and the version the app answered with, as a copy's does.
      - if: steps.start-file.outputs.present == 'true'
        run: mkdir -p .constat/preview && curl -fsS http://localhost:3000/api/v1/version -o .constat/preview/version.json || true
      - name: Walk the journeys on the app it started
        if: steps.start-file.outputs.present == 'true' && hashFiles('journeys/**/*.journey.mjs') != '' && hashFiles('.github/scripts/constat-journeys.mjs') != ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/constat-journeys" playwright@1.55.0
          "$RUNNER_TEMP/constat-journeys/node_modules/.bin/playwright" install --with-deps chromium
          GITHUB_SHA="$HEAD_SHA" CONSTAT_PLAYWRIGHT="$RUNNER_TEMP/constat-journeys/node_modules/playwright" node .github/scripts/constat-journeys.mjs http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always() && steps.start-file.outputs.present == 'true' && hashFiles('.constat/journeys/constat-journeys.json') != ''
        with: { name: constat-journeys, path: .constat/journeys/, retention-days: 90 }
      - if: always() && steps.start-file.outputs.present == 'true'
        run: docker compose -f .devcontainer/compose.yaml down -v

  base-comparison:
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-check-report
          path: .constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::the test job published no constat-check-report, so there is nothing to" \
               "compare against; publishing no before-code report. DoneMark will read every" \
               "criterion as passed-but-unproven, which is the honest degradation."
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.head-report.outcome == 'success'
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref }}"
      - if: steps.head-report.outcome == 'success'
        run: npm install
      - id: base-tests
        if: steps.head-report.outcome == 'success'
        continue-on-error: true
        run: npm run test:ci
      - if: always() && steps.base-tests.conclusion != 'skipped'
        run: |
          node .github/scripts/constat-jest-report.mjs \
            .constat/check-report/raw.json .constat/check-report-base/checks.json \
            --expected .constat/head-report/checks.json
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-base
          path: .constat/check-report-base/checks.json
          if-no-files-found: error

  # BEYOND THE LINES (board 46): packages with a known flaw, and secret-shaped strings, as SARIF for
  # DoneMark to read as the security square. Never able to fail this workflow: a scanner that cannot
  # run leaves its report out, and DoneMark says "not measured". gitleaks runs with --redact, so a
  # secret it finds is never written into the report at all.
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Scan packages and secrets
        continue-on-error: true
        run: |
          mkdir -p .constat/security
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            && chmod +x "$RUNNER_TEMP/osv-scanner" \
            && ("$RUNNER_TEMP/osv-scanner" --format sarif --output .constat/security/packages.sarif -r . || true)
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks \
            && "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner --exit-code 0 --report-format sarif --report-path .constat/security/secrets.sarif
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.constat/security/*.sarif') != ''
        with:
          # DoneMark's collector looks this artifact up by name and reads every .sarif file in it.
          name: constat-security
          path: .constat/security/
