# constat:template id=expo-phone-build-workflow version=53 sha256=555fc79533c3ebff091f31446511f860ce7a2b2fa230dd98e6f81bdb284720df
name: constat-phone-build
# Generated by DoneMark. Builds a TEST version of this app for an Android phone, so each attempt's
# preview has something to open in. Pressed by DoneMark on your default branch; never commits anything.
# EXPO_TOKEN is a repository secret, read here by your CI and nowhere else: DoneMark never holds it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Check the Expo key is saved
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not saved on this repository, so Expo cannot build the test app."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --global eas-cli@16.4.1
      - name: Link the Expo project, when the app names none yet
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if grep -qs 'u.expo.dev/' app.json app.config.json app.config.js app.config.ts; then
            echo "The app names its Expo project already."
          else
            eas init --non-interactive --force
            eas update:configure --platform all --non-interactive
          fi
      - name: A throwaway signing key for this test build
        run: |
          dir="$RUNNER_TEMP/constat-phone-key"
          mkdir -p "$dir"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          keytool -genkeypair -storetype PKCS12 -keystore "$dir/test.keystore" -alias constat-test \
            -keyalg RSA -keysize 2048 -validity 3650 -storepass "$pass" -keypass "$pass" -dname "CN=DoneMark test build"
          node -e "require('fs').writeFileSync('credentials.json', JSON.stringify({ android: { keystore: { keystorePath: process.argv[1], keystorePassword: process.argv[2], keyAlias: 'constat-test', keyPassword: process.argv[2] } } }, null, 2))" "$dir/test.keystore" "$pass"
      - name: Build the test app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p .constat/phone-build
          # Print Expo's own answer even when the build fails, then fail with it.
          set +e
          eas build --profile constat-phone --platform android --non-interactive --wait --json > .constat/phone-build/eas-build.json
          status=$?
          cat .constat/phone-build/eas-build.json
          exit $status
      - name: Describe the test app for DoneMark
        run: |
          node - <<'CONSTAT_PHONE_BUILD'
          const fs = require('node:fs');
          const answer = JSON.parse(fs.readFileSync('.constat/phone-build/eas-build.json', 'utf8'));
          const build = (Array.isArray(answer) ? answer : [answer]).find((b) => b && b.platform === 'ANDROID') || null;
          if (!build || !build.artifacts || !build.artifacts.buildUrl) {
            console.log('::error::eas build answered no Android install file, so there is no test app to describe');
            process.exit(1);
          }
          const described = {
            commit: process.env.GITHUB_SHA, buildId: build.id, installUrl: build.artifacts.buildUrl,
            runtimeVersion: build.runtimeVersion ?? null, appVersion: build.appVersion ?? null, finishedAt: build.completedAt ?? null,
          };
          fs.writeFileSync('.constat/phone-build/constat-phone-build.json', JSON.stringify(described, null, 2) + '\n');
          console.log(JSON.stringify(described, null, 2));
          CONSTAT_PHONE_BUILD
      - uses: actions/upload-artifact@v4
        with:
          # DoneMark's witness looks this artifact up by name. Renaming it is a breaking change.
          name: constat-phone-build
          path: .constat/phone-build/constat-phone-build.json
          if-no-files-found: error
