# constat:template id=expo-preview-workflow version=57 sha256=e77c797a2adac35baa7e0db177b82de6e0fc1f99e91ad9ba54110e70ada91f31
name: constat-preview
# Generated by DoneMark. Publishes THIS attempt's branch as an Expo update, so the person judging
# the attempt can open it on their phone in a development build and use it before they judge it. On
# your default branch it publishes the app as it stands, under DoneMark's own Expo branch.
#
# DoneMark presses this workflow's Run button on the attempt's branch, and on your default branch
# after a merge once the test app is installed, and reads the artifact below
# with its own read-only credential. It never publishes anything itself and never holds your Expo
# token: EXPO_TOKEN is a repository secret, read here, by your CI, and nowhere else.
#
# The update is bundled with the public variables your eas.json "preview" profile sets, so it
# talks to exactly what that profile talks to.
# Say so to whoever tries it: a preview is the attempt, against your real data.
on:
  workflow_dispatch:
    inputs:
      # Walk it on Android (12 October 2026): yes when the attempt's ask has lines to walk. The runner
      # says so; DoneMark's own press after a merge never does, so the app as it stands is never walked.
      walk:
        description: Walk this attempt on an Android emulator
        type: choice
        options: ['no', 'yes']
        default: 'no'
permissions:
  contents: read
jobs:
  preview:
    # The same machine the attempt itself ran on (spec of 6 September 2026): GitHub's, or the one
    # this project named. A preview published from somewhere else is a different build.
    runs-on: ubuntu-latest
    # Any branch: an attempt's is its preview, the default branch's is the app as it stands (11 October
    # 2026). A test app opens only the update whose code is scanned, so publishing one loads nothing.
    env:
      EXPO_PUBLIC_DONEMARK_TRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --global eas-cli@16.4.1
      # An app that names no Expo project yet cannot be published: its address exists only once your
      # Expo account has the project. Linked here, inside this job, with the same EXPO_TOKEN — made
      # on the first preview, found again on every one after — and never committed, so your
      # repository is left exactly as it was. An app that names its project skips this.
      - name: Link the Expo project, when the app names none yet
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if grep -qs 'u.expo.dev/' app.json app.config.json app.config.js app.config.ts; then
            echo "The app names its Expo project already."
          else
            eas init --non-interactive --force
            eas update:configure --platform all --non-interactive
          fi
      # One attempt is one EAS branch, named after the git branch, so it is found by name later; the
      # default branch is published under DoneMark's own, constat-as-it-stands, never one of yours.
      # The message is the commit, so what was published is never in doubt.
      - name: Publish this attempt as an Expo update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p .constat/preview
          BRANCH="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then BRANCH=constat-as-it-stands; fi
          eas update --branch "$BRANCH" --message "$GITHUB_SHA" --json --non-interactive \
            > .constat/preview/eas-update.json
          cat .constat/preview/eas-update.json
      # The app's own URL scheme — what the run page's QR is built from, so a phone CAMERA opens
      # the development build. The bare manifest address speaks only to an Expo runtime: scanned
      # with a camera it opens a browser, and Expo answers an error (finding 21 of the travel
      # test, 5 September 2026). `expo config` RESOLVES the config, which is the only way to read
      # a scheme out of an app.config.js — and it is never fatal here: the update is already
      # published by the step above, so a config that will not resolve leaves the scheme unsaid
      # rather than turning a working preview red.
      - name: Read the app's scheme
        continue-on-error: true
        run: npx --yes expo config --json --type public > .constat/preview/expo-config.json
      # What DoneMark reads: one small JSON file saying what was published, where its manifest is,
      # what it talks to, and which app opens it. Everything but the commit, the branch and the address comes from
      # eas update's own --json answer; nothing here is guessed.
      - name: Describe the preview for DoneMark
        run: |
          node - <<'CONSTAT_PREVIEW'
          const fs = require('node:fs');
          const answer = JSON.parse(fs.readFileSync('.constat/preview/eas-update.json', 'utf8'));
          const updates = (Array.isArray(answer) ? answer : Object.values(answer)).flat()
            .filter((u) => u && typeof u === 'object');
          if (updates.length === 0) {
            console.log('::error::eas update published no update, so there is no preview to describe');
            process.exit(1);
          }
          // The Android update: the test app is built for Android, and with runtimes that follow the
          // app's parts Expo publishes one group per platform (the live walk of 12 October 2026) — so
          // its group and its runtime are read from the same update, never one from each.
          const android = updates.find((u) => u.platform === 'android') || updates[0];
          const group = android.group || android.updateGroup;
          // The scheme and the app's name: out of the resolved config when the step above
          // answered, out of app.json when it did not — most apps keep their scheme there, and a
          // resolve that failed is no reason to lose it. Null rather than a guess when neither
          // names one: the run page then draws the bare manifest address and says so.
          const readJson = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return null; }
          };
          const config = readJson('.constat/preview/expo-config.json')
            || readJson('app.json') || readJson('app.config.json') || {};
          const expoConfig = config.expo || config;
          // The project: named in the workflow, or in what was published, or — for an app whose
          // project was linked in this job — in the config the link step wrote.
          const projectId = process.env.CONSTAT_EXPO_PROJECT_ID || android.projectId
            || (expoConfig.extra && expoConfig.extra.eas && expoConfig.extra.eas.projectId) || '';
          if (!group || !projectId) {
            console.log('::error::the update has no group or no project id, so its manifest address cannot be built');
            process.exit(1);
          }
          // Expo allows several schemes; one QR is one address, so the first of them.
          const one = (value) => {
            const first = Array.isArray(value) ? value.find((v) => typeof v === 'string' && v.trim() !== '') : value;
            return typeof first === 'string' && first.trim() !== '' ? first.trim() : null;
          };
          const preview = {
            schema: 'constat.preview/v1',
            commit: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
            runtimeVersion: android.runtimeVersion || null,
            runtimePlatform: android.platform || null,
            updateGroup: group,
            manifestUrl: 'https://u.expo.dev/' + projectId + '/group/' + group,
            scheme: one(expoConfig.scheme),
            appName: one(expoConfig.name),
            platforms: [...new Set(updates.map((u) => u.platform).filter(Boolean))],
            talksTo: process.env.EXPO_PUBLIC_API_URL || null,
            publishedAt: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
          };
          fs.writeFileSync('.constat/preview/constat-preview.json', JSON.stringify(preview, null, 2) + '\n');
          console.log(JSON.stringify(preview, null, 2));
          CONSTAT_PREVIEW
      - uses: actions/upload-artifact@v4
        with:
          # DoneMark's preview collector looks this artifact up by name and reads
          # constat-preview.json out of it. Renaming either is a breaking change to the evidence
          # pathway, not a tidy-up.
          name: constat-preview
          path: .constat/preview/constat-preview.json
          if-no-files-found: error
  # WALK IT ON ANDROID (12 October 2026). Only when the attempt's ask has lines to walk: an Android
  # emulator on GitHub's machines, the app's own test app (the newest one your phone-build workflow
  # made), opened on the update just published, and Maestro tapping through each walk in journeys/,
  # every step photographed. About five minutes. DoneMark reads what it walked; it never runs a walk.
  walk:
    needs: preview
    if: ${{ inputs.walk == 'yes' }}
    runs-on: ubuntu-latest
    # A walk that could not run is never a red attempt (final review, 12 October 2026): it says why instead.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find the walks
        id: walks
        run: |
          if ls journeys/*.walk.yaml > /dev/null 2>&1; then echo "any=yes" >> "$GITHUB_OUTPUT"; else echo "There is no walk in journeys/, so nothing is walked."; fi
      - uses: actions/download-artifact@v4
        if: steps.walks.outputs.any == 'yes'
        with:
          name: constat-preview
          path: .constat/walk-preview
      # The test app: the newest successful build your constat-phone-build.yml made, read from its own
      # artifact, and downloaded only from Expo's address.
      - name: Find the test app
        if: steps.walks.outputs.any == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .constat/walk-build
          RUN=$(gh run list --workflow constat-phone-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$RUN" ]; then echo "CONSTAT_NOT_WALKED=there is no test app built yet" >> "$GITHUB_ENV"; exit 0; fi
          gh run download "$RUN" -n constat-phone-build -D .constat/walk-build || { echo "CONSTAT_NOT_WALKED=the test app's build left no description to read" >> "$GITHUB_ENV"; exit 0; }
          URL=$(node -e "const b=JSON.parse(require('fs').readFileSync(require('path').join('.constat/walk-build', require('fs').readdirSync('.constat/walk-build')[0]),'utf8'));process.stdout.write(b.installUrl||'')" || true)
          case "$URL" in
            https://expo.dev/*|https://api.expo.dev/*) curl -fsSL -o app.apk "$URL" || echo "CONSTAT_NOT_WALKED=the test app could not be downloaded from Expo" >> "$GITHUB_ENV" ;;
            *) echo "CONSTAT_NOT_WALKED=the test app's address is not Expo's" >> "$GITHUB_ENV" ;;
          esac
          echo "CONSTAT_PHONE_BUILD_JSON=$(ls .constat/walk-build/*.json | head -1)" >> "$GITHUB_ENV"
      - name: Get the walking tools
        if: steps.walks.outputs.any == 'yes'
        run: |
          curl -fsSL -o maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          unzip -q maestro.zip -d "$HOME/.maestro-cli" && echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          npm install --no-save --prefix .constat/walk-deps yaml@2.9.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk it on Android
        if: steps.walks.outputs.any == 'yes'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          CONSTAT_PREVIEW_JSON: .constat/walk-preview/constat-preview.json
          CONSTAT_YAML: ${{ github.workspace }}/.constat/walk-deps/node_modules/yaml
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: if [ -f app.apk ]; then adb install -r app.apk; fi; node .github/scripts/constat-phone-walks.mjs
      # Whatever stopped the walk before it could report, DoneMark is told it was not walked, and why.
      - name: Say why, when the walk could not run
        if: ${{ always() && steps.walks.outputs.any == 'yes' }}
        run: |
          node - <<'CONSTAT_NOT_WALKED'
          const fs = require('node:fs');
          const at = '.constat/journeys/constat-journeys.json';
          if (!fs.existsSync(at)) {
            fs.mkdirSync('.constat/journeys', { recursive: true });
            fs.writeFileSync(at, JSON.stringify({
              schema: 'constat.journeys/v1', commit: process.env.GITHUB_SHA, url: null, copyAnswered: null,
              ranAt: new Date().toISOString(), walkedOn: 'android', journeys: [],
              notWalked: 'the walk could not be run on GitHub’s machine — the walk job’s log says why',
            }, null, 2) + '\n');
          }
          CONSTAT_NOT_WALKED
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.walks.outputs.any == 'yes' }}
        with:
          # DoneMark reads this the way it reads a web app's journeys. Renaming it breaks the reading.
          name: constat-journeys
          path: .constat/journeys/
          if-no-files-found: error
