# constat:template id=node-coverage-mutation-workflow version=52 sha256=8c87cd2089a4389492030fa155037daba54a85c7ead1d9e2316edb92d1fc0db5
name: constat-ci-coverage-mutation
# Generated by DoneMark's onboarding pull request. Publishes exactly the catalog entries this
# repository's CI did not already publish (see @constat/evidence's EVIDENCE_CATALOG) — the third
# proof (line coverage) and/or the fourth (mutation), whichever this repository was missing. It
# never touches constat-ci.yml or any job already publishing the check report: this file is
# additive, on purpose, so a repository catching up loses nothing it already had.
on:
  pull_request:
jobs:
  coverage:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      # Best-effort by design: a single test file's coverage run failing must not take down every
      # OTHER check's coverage comparison — the script itself catches and logs per-file failures.
      - run: node .github/scripts/constat-jest-coverage.mjs .constat/check-coverage/coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-coverage
          path: .constat/check-coverage/coverage.json
          if-no-files-found: error

  mutation:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MUTATION_MAX_MUTANTS: 6
      MUTATION_BUDGET_SECONDS: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: node .github/scripts/constat-jest-mutation.mjs "${{ github.base_ref }}" .constat/check-mutation/mutation.json
      - if: always()
        run: |
          git status --porcelain
          git checkout -- .
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-mutation
          path: .constat/check-mutation/mutation.json
          if-no-files-found: error
